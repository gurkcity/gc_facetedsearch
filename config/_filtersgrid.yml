services:
  _defaults:
    public: true

  onlineshopmodule.module.facetedsearch.grid.factory.filters:
    class: 'PrestaShop\PrestaShop\Core\Grid\GridFactory'
    arguments:
      - '@onlineshopmodule.module.facetedsearch.grid.definition.factory.filters'
      - '@onlineshopmodule.module.facetedsearch.grid.data.factory.filters.decorator'
      - '@prestashop.core.grid.filter.form_factory'
      - '@prestashop.core.hook.dispatcher'
    public: true

  onlineshopmodule.module.facetedsearch.grid.definition.factory.filters:
    class: 'Onlineshopmodule\PrestaShop\Module\Facetedsearch\Grid\FacetedSearchFilter\FiltersGridDefinitionFactory'
    parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'
    arguments:
      - '@prestashop.core.hook.dispatcher'
    autowire: true
    public: true

  onlineshopmodule.module.facetedsearch.grid.data.factory.filters:
    class: '%prestashop.core.grid.data.factory.doctrine_grid_data_factory%'
    arguments:
      - '@onlineshopmodule.module.facetedsearch.grid.query_builder.filters'
      - '@prestashop.core.hook.dispatcher'
      - '@prestashop.core.grid.query.doctrine_query_parser'
      - 'gc_facetedsearch_filters'
    public: true

  onlineshopmodule.module.facetedsearch.grid.data.factory.filters.decorator:
    class: 'Onlineshopmodule\PrestaShop\Module\Facetedsearch\Grid\FacetedSearchFilter\FiltersGridDecorator'
    arguments:
      $dataFactory: '@onlineshopmodule.module.facetedsearch.grid.data.factory.filters'
      $module: '@onlineshopmodule.module.facetedsearch.gc_facetedsearch'

  onlineshopmodule.module.facetedsearch.grid.query_builder.filters:
    class: 'Onlineshopmodule\PrestaShop\Module\Facetedsearch\Grid\FacetedSearchFilter\FiltersQueryBuilder'
    parent: 'prestashop.core.grid.abstract_query_builder'
    arguments:
      - '@prestashop.core.query.doctrine_search_criteria_applicator'
    public: true
